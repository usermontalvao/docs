# Serviço de conversão DOCX <-> SFDT do Syncfusion (Word Processor Server).
#
# Este compose sobe TRÊS containers:
#   1) word-processor-server  -> o conversor oficial do Syncfusion (interno, porta 80).
#                               NÃO customizado: as rotas de hoje (Import, Export,
#                               ExportSFDT, MailMerge, SpellCheck...) seguem servidas
#                               pelo binário oficial, sem alteração nenhuma.
#   2) pdf-service            -> imagem NOSSA (ASP.NET Core 8 + Syncfusion DocIORenderer)
#                               que atende só POST /api/documenteditor/ConvertToPdf:
#                               .docx entra, application/pdf sai. Existe porque a imagem
#                               oficial não embarca o DocIORenderer.
#   3) caddy                  -> reverse proxy (modo túnel): CORS restrito + rate limit +
#                               allowlist de rotas/métodos + health endpoints. O HTTPS
#                               público é do túnel (Cloudflare/ngrok), não do Caddy.
#
# O CRM (frontend estático) continua no Render. Só o Import de DOCX do editor
# passa a bater aqui, em vez do endpoint demo público do Syncfusion.
#
# Uso:
#   1) copie .env.server.example para .env.server e preencha as variáveis
#   2) docker compose up -d
#   3) aponte VITE_SYNC_FUSION do CRM para https://SEU_DOMINIO/api/documenteditor/
#
# Veja DEPLOY.md para o passo a passo completo (DNS, TLS, verificação).

services:
  word-processor-server:
    image: syncfusion/word-processor-server:latest
    container_name: docx-word-processor
    restart: unless-stopped
    # Endurecimento: impede escalada de privilégios dentro do container.
    security_opt:
      - no-new-privileges:true
    environment:
      # No Portainer: defina SYNCFUSION_LICENSE_KEY na aba "Environment variables" do stack.
      # No CLI: docker compose --env-file .env.server up -d --build
      SYNCFUSION_LICENSE_KEY: ${SYNCFUSION_LICENSE_KEY}
    expose:
      - "80"                   # só exposto na rede interna; quem publica é o Caddy
    networks:
      - docxnet
    # Rotação de logs: sem isto o json-file cresce sem limite e enche o disco do host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  pdf-service:
    # Imagem NOSSA: ASP.NET Core 8 + Syncfusion DocIORenderer (ver pdf-service/Dockerfile).
    # No Portainer, como o stack vem de repositório Git, o `build` acha o contexto sozinho.
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    container_name: docx-pdf-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # MESMA licença do word-processor-server; precisa cobrir Document Processing / DocIO.
      SYNCFUSION_LICENSE_KEY: ${SYNCFUSION_LICENSE_KEY}
      # Gate opcional da rota de PDF. VAZIO = desligado (comportamento de hoje).
      # Preenchido, exige o header X-Api-Key. Ver .env.server.example.
      PDF_API_KEY: ${PDF_API_KEY:-}
      ASPNETCORE_HTTP_PORTS: "8080"
    expose:
      - "8080"                 # só na rede interna; quem publica é o Caddy
    networks:
      - docxnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Rasterizar/desenhar um DOCX grande custa mais que converter para SFDT.
          # Se um documento longo estourar, suba a memória antes da CPU.
          cpus: "2.0"
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A primeira subida do .NET + registro de licença leva alguns segundos.
      start_period: 30s

  caddy:
    # Imagem custom: Caddy + plugin de rate limit (ver Dockerfile).
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docx-caddy
    restart: unless-stopped
    # Endurecimento: impede escalada de privilégios dentro do container.
    security_opt:
      - no-new-privileges:true
    ports:
      # MODO TÚNEL: publica só no localhost, numa porta ALEATÓRIA -> Caddy interno :8080.
      # O túnel (Cloudflare/ngrok) aponta para http://localhost:42811.
      # Trocar a porta aleatória? Mude só o número da esquerda (host).
      - "127.0.0.1:42811:8080"
    volumes:
      # Caddyfile agora é embutido na imagem (COPY no Dockerfile) — sem bind mount.
      - caddy_data:/data       # estado interno do Caddy (não há mais cert TLS aqui)
      - caddy_config:/config
    depends_on:
      - word-processor-server
      - pdf-service
    networks:
      - docxnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null 2>&1 || curl -fsS http://localhost:8080/health/live >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  docxnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
